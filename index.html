<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lahnreit 1956 · Spielleitung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Jost:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <button type="button" class="leise nur-schmal" id="rail-knopf" aria-controls="rail">Liste</button>
  <div class="brand"><b>Lahnreit 1956</b><span>Spielleitung</span></div>
  <div class="uhr" role="group" aria-label="Tageszeit"></div>
  <div class="bar-rechts">
    <div class="suche"><input id="suche" type="search" placeholder="Suchen, z. B. Knopf" aria-label="Im ganzen Abenteuer suchen" autocomplete="off"><button type="button" class="leise" id="suche-knopf">Suchen</button></div>
    <button type="button" class="leise" id="personen-knopf">Personen</button>
    <button type="button" class="leise" id="thema-knopf" aria-label="Hell oder dunkel" title="Hell oder dunkel">◐</button>
  </div>
</header>
<div class="shell">
  <aside class="rail" id="rail" aria-label="Ablauf, Orte und Requisiten"></aside>
  <main class="view" id="view"></main>
  <aside class="gespraech" id="gespraech" aria-label="Gespräch" hidden></aside>
</div>
<div class="overlay" id="overlay" hidden></div>
<div class="kontext" id="kontext" role="dialog" aria-label="Ganzer Text" hidden></div>
<div class="zeigen" id="zeigen" role="dialog" aria-label="Den Spielern zeigen" hidden></div>
<script src="data/lahnreit-daten.js"></script>
<script src="data/grundrisse.js"></script>
<script src="data/kurz.js"></script>
<script src="data/modelle.js"></script>
<script src="data/requisiten.js"></script>
<script src="modell.js"></script>
<script src="app.js"></script>
</body>
</html>
