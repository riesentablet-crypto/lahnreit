<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lahnreit 1956 · Spielleitung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Jost:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><b>Lahnreit 1956</b><span>Spielleitung</span></div>
    <button type="button" class="leise side-toggle" id="side-toggle" aria-controls="side" aria-expanded="false">Liste</button>
    <nav class="tabs" aria-label="Bereiche">
      <button type="button" data-tab="personen">Personen</button>
      <button type="button" data-tab="szenen">Szenen</button>
    </nav>
    <div class="wer-wrap"><span class="wer-label">Wer fragt</span>
      <div class="wer" role="group" aria-label="Wer fragt">
        <button type="button" data-wer="B">Brandl</button>
        <button type="button" data-wer="Hd">Hagedorn</button>
        <button type="button" data-wer="Hs">Hias</button>
      </div>
    </div>
    <div class="suche"><input id="suche" type="search" placeholder="Stichwort, z. B. Föhn, Knopf, Leni" aria-label="Suchen"></div>
  </header>
  <div class="shell">
    <aside class="side" id="side" aria-label="Liste"></aside>
    <main class="view" id="view"></main>
  </div>
</div>
<script src="data/lahnreit-daten.js"></script>
<script src="app.js"></script>
</body>
</html>
